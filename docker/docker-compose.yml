version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: askdb_mysql
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: askdb_sample
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../database/sample_mysql.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - askdb_network

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: askdb_backend
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - askdb_network
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=
      - DB_NAME=askdb_sample
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-flash-latest}

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: askdb_frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend
    networks:
      - askdb_network
    environment:
      - API_URL=http://backend:8000

networks:
  askdb_network:
    driver: bridge

volumes:
  mysql_data:
